name: Refresh offers

# Scrapes Lidl, Aldi, Dirk and Jumbo, fetches this week's AH bonus from AH's app API, and merges
# them into the offers saved on the Cloudflare site; next week's AH offers uploaded there switch in
# once their week starts. Runs every morning at 06:00 Dutch time, on Friday at 20:00 as well (to
# pick up next week's offers, which the stores publish by then), from the "Run workflow" button in
# the Actions tab, or from the site's "Run now" button.
#
# Needs the repository secret UPLOAD_PASSWORD (same as the Cloudflare secret)
# and the repository variable SITE_URL (e.g. https://grocerypricecompare.pages.dev).

on:
  # Cron is in UTC and the Netherlands moves between UTC+1 and UTC+2, so both are scheduled and the
  # clock job below lets through only the ones that are 06:00 (daily) and 20:00 (Friday) in Amsterdam today.
  schedule:
    - cron: "0 4 * * *"   # 06:00 in summer (CEST, UTC+2)
    - cron: "0 5 * * *"   # 06:00 in winter (CET, UTC+1)
    - cron: "0 18 * * 5"  # Friday 20:00 in summer
    - cron: "0 19 * * 5"  # Friday 20:00 in winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      is_due: ${{ steps.check.outputs.is_due }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Decided by the UTC offset, not the clock, so a late-started run still counts.
          if [ "$(TZ=Europe/Amsterdam date +%z)" = "+0200" ]; then
            daily="0 4 * * *"; friday="0 18 * * 5"
          else
            daily="0 5 * * *"; friday="0 19 * * 5"
          fi
          if [ "$EVENT" != "schedule" ] || [ "$SCHEDULE" = "$daily" ] || [ "$SCHEDULE" = "$friday" ]; then
            echo "is_due=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: clock
    if: needs.clock.outputs.is_due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run account tests
        run: npm test

      - name: Scrape Lidl, Aldi, Dirk, Jumbo and AH and save to the site
        env:
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: python -m scraper.publish --site "${{ vars.SITE_URL }}"
