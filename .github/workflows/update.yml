name: Refresh offers

# Scrapes Lidl and merges it into the offers saved on the Cloudflare site
# (next to the AH offers uploaded there). Runs every Monday, from the
# "Run workflow" button in the Actions tab, or from the site's "Run now" button.
#
# Needs the repository secret UPLOAD_PASSWORD (same as the Cloudflare secret)
# and the repository variable SITE_URL (e.g. https://grocerypricecompare.pages.dev).

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays ~06:17 Dutch time (05:17 UTC), when the offer weeks start
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

      - name: Scrape Lidl and save to the site
        env:
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
        run: python -m scraper.publish --site "${{ vars.SITE_URL }}"
